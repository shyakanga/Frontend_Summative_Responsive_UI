<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings Page</title>
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="styles/settings.css" />
    <script type="module" src="./scripts/settings.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header>
      <p>BOOK APP</p>
    </header>

    <div class="layout">
      <nav>
        <ul>
          <li><a href="index.html">Dashboard</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="records.html">Records</a></li>
          <li><a href="add-edit.html">Add/Edit Forms</a></li>
          <li><a href="settings.html" aria-current="page">Settings</a></li>
        </ul>
      </nav>

      <main class="settings" id="main">
        <h1>Settings</h1>

        <div class="settings-options">
          <div class="option">
            <label for="page-cap">Page cap</label>
            <span>
              <input type="number" min="1" id="pages-cap" />
              <p id="pagesCap-message" role="status"></p>
            </span>
            </div>

          <div class="option">
            <label for="pages-per-hour">Reading Speed <br>/ hour</label>
            <span>
              <input type="number" min="1" id="pages-per-hour" />
              <p id="pPh-message" role="status"></p>
            </span>
          </div>

          <div class="saveBtn">
            <p id="message" role="status"></p>
            <button id="save">save</button>
          </div>

          <div class="option">
            <label for="export-data">Export Data</label>
            <span>
              <button type="button" id="export-data">Export data</button>
              <p id="export-message" role="status"></p>
            </span>
          </div>

          <div class="option">
            <label for="import-data">Import Data</label>
            <span>
              <input type="file" id="import-data" accept=".json" />
              <p id="import-message" role="status"></p>
            </span>
          </div>
        </div>
      </main>
    </div>

    <footer>BOOK APP made by carrick</footer>
  </body>
</html>
