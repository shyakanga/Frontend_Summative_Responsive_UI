<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book App</title>
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="styles/dashboard.css" />
  </head>
  <body>
    <header>
      <p>BOOK APP</p>
    </header>

    <div class="layout">
      <nav>
        <ul>
          <li><a href="index.html" aria-current="page">Dashboard</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="records.html">Records</a></li>
          <li><a href="add-edit.html">Add/Edit Forms</a></li>
          <li><a href="settings.html">Settings</a></li>
        </ul>
      </nav>
      <main>
        <div class="dashboard">
          <h1>Dashboard</h1>

          <div class="top-stats">
            <div class="main-stat">
              <p class="stat-title">Main Stat</p>
              <p class="number">100</p>
            </div>

            <div class="side-stats">
              <div class="top-pages">
                <p class="stat-title">Top Pages</p>
                <p class="number">0</p>
                <p class="reading-time">Time spent reading</p>
              </div>

              <div class="top-tag">
                <p class="stat-title">Top Tag</p>
                <p class="number">The top tag</p>
              </div>
            </div>
          </div>

          <div class="dash-body">
            <div class="chart">
              <h2>Chart</h2>
              <div class="chart-visuals">
                <div class="day">
                  <div class="bar-space">
                    <div class="bar" style="height: 80%">
                      <span>80</span>
                    </div>
                  </div>
                  <span>Day</span>
                </div>

                <div class="day">
                  <div class="bar-space">
                    <div class="bar" style="height: 95%">
                      <span>95</span>
                    </div>
                  </div>
                  <span>Day</span>
                </div>

                <div class="day">
                  <div class="bar-space">
                    <div class="bar" style="height: 30%">
                      <span>30</span>
                    </div>
                  </div>
                  <span>Day</span>
                </div>

                <div class="day">
                  <div class="bar-space">
                    <div class="bar" style="height: 60%">
                      <span>60</span>
                    </div>
                  </div>
                  <span>Day</span>
                </div>

                <div class="day">
                  <div class="bar-space">
                    <div class="bar" style="height: 70%">
                      <span>70</span>
                    </div>
                  </div>
                  <span>Day</span>
                </div>

                <div class="day">
                  <div class="bar-space">
                    <div class="bar" style="height: 100%">
                      <span>100</span>
                    </div>
                  </div>
                  <span>Day</span>
                </div>

                <div class="day">
                  <div class="bar-space">
                    <div class="bar" style="height: 12%">
                      <span>12</span>
                    </div>
                  </div>
                  <span>Day</span>
                </div>
              </div>
            </div>

            <div class="page-cap">
              <h2>Page Cap</h2>
              <p>You have not hit the page cap yet. 0/0</p>
            </div>
          </div>
        </div>
      </main>
    </div>

    <footer>BOOK APP made by carrick</footer>
  </body>
</html>
