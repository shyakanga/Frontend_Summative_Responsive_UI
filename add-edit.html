<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add/Edit/delete Page</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/add-edit.css">
  </head>
  <script type="module" src="scripts/add-edit.js"></script>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header>
      <p>BOOK APP</p>
    </header>

    <div class="layout">
      <nav>
        <ul>
          <li><a href="index.html">Dashboard</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="records.html">Records</a></li>
          <li><a href="add-edit.html" aria-current="page">Add/Edit Forms</a></li>
          <li><a href="settings.html">Settings</a></li>
        </ul>
      </nav>

      <main id="main">
        <h1>ADD / EDIT / DELETE</h1>
        <div class="forms">
            <div class="form-cont add-form">
                <h2>Add Book Form</h2>
                <form id="add-form">
                    <label for="title">Title</label>
                    <input type="text" id="add-title" placeholder="Book Title">
                    <p class="error" id="add-title-error" role="status"></p>

                    <label for="author">Author</label>
                    <input type="text" id="add-author" placeholder="Author">
                    <p class="error" id="add-author-error" role="status"></p>

                    <label for="pages">Pages</label>
                    <input type="number" id="add-pages" placeholder="100">
                    <p class="error" id="add-pages-error" role="status"></p>

                    <label for="tag">Tag</label>
                    <input type="text" id="add-tag" placeholder="sector/industry">
                    <p class="error" id="add-tag-error" role="status"></p>

                    <label for="add-date">Date Added</label>
                    <input type="text" id="add-date" placeholder="YYYY-MM-DD">
                    <p class="error" id="add-date-error" role="status"></p>

                    <button type="submit" id="add-button">Add Book</button>
                    <p class="message" id="add-message" role="status"></p>
                </form>
            </div>

            <div class="form-cont edit-form">
                <h2>Edit / Delete Book Form</h2>

                <form id="edit-form">
                    <label for="edit-id">Book ID</label>
                    <input type="text" id="edit-id" placeholder="bokk_001">
                    <p class="error" id="edit-id-message" role="status"></p>

                    <label for="edit-title">Title</label>
                    <input type="text" id="edit-title" placeholder="Your title"/>
                    <p class="error" id="edit-title-error" role="status"></p>

                    <label for="edit-author">Author</label>
                    <input type="text" id="edit-author" placeholder="authoe">
                    <p class="error" id="edit-author-error" role="status"></p>

                    <label for="edit-pages">Pages</label>
                    <input type="text" id="edit-pages" placeholder="100">
                    <p class="error" id="edit-pages-error" role="status"></p>

                    <label for="edit-tag">Tag</label>
                    <input type="text" id="edit-tag" placeholder="industry">
                    <p class="error" id="edit-tag-error" role="status"></p>

                    <label for="edit-date">Date Added</label>
                    <input type="text" id="edit-date" placeholder="YYYY-MM-DD">
                    <p class="error" id="edit-date-error" role="status"></p>

                    <button type="submit" id="edit-button">Edit</button>
                    <p class="message" id="edit-message" role="status"></p>

                    <button type="submit" id="delete-button">Delete book</button>
                    
                </form>
            </div>
        </div>
      </main>
    </div>

    <footer>BOOK APP made by carrick</footer>
  </body>
</html>
