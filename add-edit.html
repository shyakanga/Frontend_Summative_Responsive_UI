<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add/Edit/delete Page</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/add-edit.css">
  </head>
  <body>
    <header>
      <p>BOOK APP</p>
    </header>

    <div class="layout">
      <nav>
        <ul>
          <li><a href="index.html">Dashboard</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="records.html">Records</a></li>
          <li><a href="add-edit.html" aria-current="page">Add/Edit Forms</a></li>
          <li><a href="settings.html">Settings</a></li>
        </ul>
      </nav>

      <main>
        <h1>ADD / EDIT / DELETE</h1>
        <div class="forms">
            <div class="form-cont add-form">
                <h2>Add Book Form</h2>
                <form id="add-form">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="Book Title">

                    <label for="author">Author</label>
                    <input type="text" id="author" placeholder="Author">

                    <label for="pages">Pages</label>
                    <input type="number" id="pages" placeholder="100">

                    <label for="tag">Tag</label>
                    <input type="text" id="tag" placeholder="sector/industry">

                    <label for="date-added">Date Added</label>
                    <input type="text" id="data-added" placeholder="YYYY-MM-DD">

                    <button type="submit" id="add-button">Add Book</button>
                </form>
            </div>

            <div class="form-cont edit-form">
                <h2>Edit / Delete Book Form</h2>

                <form id="edit-form">
                    <label for="edit-book-id">Book ID</label>
                    <input type="text" id="edit-book-id" placeholder="bokk_001">

                    <label for="edit-book-titel">Title</label>
                    <input type="text" id="edit-book-title" placeholder="title">

                    <label for="edit-book-author">Author</label>
                    <input type="text" id="edit-book-author" placeholder="authoe">

                    <label for="edit-book-pages">Pages</label>
                    <input type="text" id="edit-book-pages" placeholder="100">

                    <label for="edit-book-tag">Tag</label>
                    <input type="text" id="edit-book-tag" placeholder="industry">

                    <label for="edit-book-date">Date Added</label>
                    <input type="text" id="edit-book-date" placeholder="YYYY-MM-DD">

                    <button type="submit" id="edit-button" disabled>Edit</button>

                    <button type="submit" id="delete-button" disabled>Delete book</button>
                    
                </form>
            </div>
        </div>
      </main>
    </div>

    <footer>BOOK APP made by carrick</footer>
  </body>
</html>
