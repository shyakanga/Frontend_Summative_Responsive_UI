<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Records Page</title>
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="styles/records.css" />
  </head>
  <script type="module" src="scripts/records.js"></script>
  <body>
    <header>
      <p>BOOK APP</p>
    </header>

    <div class="layout">
      <nav>
        <ul>
          <li><a href="index.html">Dashboard</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="records.html" aria-current="page">Records</a></li>
          <li><a href="add-edit.html">Add/Edit Forms</a></li>
          <li><a href="settings.html">Settings</a></li>
        </ul>
      </nav>

      <main>
        <h1>Records</h1>

        <section class="search">
          <label for="search">Search</label>
          <input type="text" id="search" />

          <label for="case-sensitive">
            <input type="checkbox" id="ignore-case" />
            Case sensitive
          </label>

          <p class="error" id="search-error"></p>
          <p id="empty-message" hidden>No books found</p>
        </section>

        <section class="table-content">
          <table>
            <thead>
              <tr>
                <th scope="col">
                  <button type="button" id="sort-title">Title</button>
                </th>

                <th scope="col">Author</th>

                <th scope="col">
                  <button type="button" id="sort-pages">Pages</button>
                </th>

                <th scope="col">Tag</th>

                <th scope="col">
                  <button type="button" id="sort-date">Created</button>
                </th>

                <th scope="col">Updated</th>

                <th scope="col">ID</th>
              </tr>
            </thead>

            <tbody id="table-body">
              
            </tbody>
          </table>
        </section>

        <section class="cards" id="cards">
          
        </section>
      </main>
    </div>

    <footer>BOOK APP made by carrick</footer>
  </body>
</html>
